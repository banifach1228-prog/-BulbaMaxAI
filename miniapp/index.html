<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Bulba AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#09090b;--panel:#111114;--panel2:#17171b;--line:rgba(255,255,255,.09);--text:#f5f5f7;--muted:#8c8c95;--user:#202024;--danger:#ff5c5c;--ok:#66d18f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;outline:0}
#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -20%,rgba(255,255,255,.07),transparent 36%),var(--bg)}

.topbar{height:64px;min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);background:rgba(9,9,11,.84);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo,.welcomeLogo{display:grid;place-items:center;background:#f5f5f7;color:#08080a;font-weight:900;box-shadow:0 10px 35px rgba(255,255,255,.08)}
.logo{width:39px;height:39px;border-radius:13px;font-size:19px}
.brandName{font-size:16px;font-weight:800}
.status{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(102,209,143,.55)}
.topActions{display:flex;gap:7px}
.iconBtn,.modelBtn{height:40px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center}
.iconBtn{width:40px;font-size:20px}
.modelBtn{max-width:145px;padding:0 11px;gap:6px;font-size:12px;font-weight:700}
.modelName{max-width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 13px 12px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:0}
.welcome{min-height:calc(100% - 15px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}
.welcomeLogo{width:68px;height:68px;border-radius:22px;font-size:30px;margin-bottom:18px}
.welcome h1{margin:0;font-size:28px;letter-spacing:-1px}
.welcome p{max-width:320px;margin:9px 0 0;color:var(--muted);line-height:1.45;font-size:14px}
.suggestions{width:100%;max-width:400px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.suggestion{padding:13px;text-align:left;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025);color:#ddd;font-size:12px;line-height:1.35}
.messageRow{display:flex;width:100%;margin-bottom:15px}
.messageRow.user{justify-content:flex-end}
.messageRow.assistant{justify-content:flex-start}
.bubble{max-width:min(90%,760px);padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.user .bubble{background:var(--user);border:1px solid rgba(255,255,255,.055);border-bottom-right-radius:6px;white-space:pre-wrap}
.assistant .bubble{padding:4px 2px;background:transparent}
.photo{display:block;max-width:270px;max-height:360px;border-radius:15px;margin-bottom:7px;border:1px solid var(--line);object-fit:cover}
.copyBtn{display:block;margin-top:8px;color:#77777f;font-size:11px}
.copyBtn:active{color:#fff}
.md p{margin:0 0 9px}
.md p:last-child{margin-bottom:0}
.md strong{font-weight:800}
.md code{padding:2px 5px;border-radius:6px;background:#1b1b20;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}
.md pre{margin:9px 0;padding:11px;overflow:auto;border-radius:12px;background:#151519;border:1px solid var(--line);white-space:pre}
.md ul,.md ol{margin:7px 0 9px;padding-left:21px}
.md a{color:#dcdce1;text-decoration:underline}
.typing{display:flex;gap:4px;padding:9px 2px}
.typing span{width:6px;height:6px;border-radius:50%;background:#77777f;animation:pulse 1.1s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,70%,100%{transform:scale(.7);opacity:.35}35%{transform:scale(1);opacity:1}}

.composerWrap{padding:7px 9px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(9,9,11,1) 75%,rgba(9,9,11,0))}
.preview{display:none;padding:0 4px 8px}
.preview.show{display:block}
.previewBox{position:relative;width:76px;height:76px}
.preview img{width:76px;height:76px;object-fit:cover;border-radius:15px;border:1px solid var(--line)}
.removePhoto{position:absolute;top:-6px;right:-6px;width:23px;height:23px;border-radius:50%;background:#242428;border:1px solid rgba(255,255,255,.12);font-size:14px}
.composer{min-height:54px;display:flex;align-items:flex-end;gap:7px;padding:7px;border:1px solid var(--line);border-radius:19px;background:rgba(18,18,21,.96);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.attach{width:40px;height:40px;flex:0 0 40px;border-radius:13px;color:#a3a3aa;font-size:21px}
.attach:active{background:rgba(255,255,255,.07)}
#input{flex:1;min-height:40px;max-height:150px;resize:none;outline:0;border:0;background:transparent;color:var(--text);padding:10px 4px 9px;line-height:1.35;font-size:15px}
#input::placeholder{color:#67676f}
.send{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;background:#f5f5f7;color:#09090b;font-size:18px;font-weight:900}
.send:disabled{opacity:.3}
#file{display:none}

.overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.58);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.overlay.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;overflow-y:auto;background:#111114;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:12px 14px calc(20px + env(safe-area-inset-bottom));animation:sheetIn .18s ease-out}
@keyframes sheetIn{from{transform:translateY(25px);opacity:.5}to{transform:translateY(0);opacity:1}}
.handle{width:38px;height:4px;border-radius:99px;background:#39393e;margin:0 auto 15px}
.sheetTitle{font-size:18px;font-weight:800;margin-bottom:11px}
.sheetSub{color:var(--muted);font-size:12px;margin:-5px 0 12px}
.rowBtn,.chatItem,.modelOption,.styleOption{width:100%;min-height:50px;padding:10px 12px;margin-bottom:7px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.025);display:flex;align-items:center;justify-content:space-between;text-align:left}
.rowBtn:active,.chatItem:active,.modelOption:active,.styleOption:active{background:rgba(255,255,255,.08)}
.selected{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.18)!important}
.itemTitle{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itemMeta{font-size:11px;color:var(--muted);margin-top:3px}
.itemLeft{min-width:0}
.check{font-weight:900}
.danger{color:var(--danger)}
.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.textInput{width:100%;height:46px;margin:4px 0 8px;padding:0 13px;border:1px solid var(--line);border-radius:13px;outline:0;background:#18181c;color:var(--text)}
.memoryItem{padding:10px 12px;border:1px solid var(--line);border-radius:13px;margin-bottom:7px;background:rgba(255,255,255,.025)}
.memoryKey{font-size:12px;font-weight:800}
.memoryValue{font-size:12px;color:#bbb;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,15px);z-index:100;max-width:88%;padding:10px 14px;border-radius:13px;background:#242428;border:1px solid var(--line);color:#fff;font-size:12px;text-align:center;opacity:0;pointer-events:none;transition:.18s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){
.topbar{padding-left:24px;padding-right:24px}
#chat{padding-left:max(14px,calc((100% - 850px)/2));padding-right:max(14px,calc((100% - 850px)/2))}
.composerWrap{padding-left:max(10px,calc((100% - 850px)/2));padding-right:max(10px,calc((100% - 850px)/2))}
}
</style>
</head>

<body>
<div id="app">

<header class="topbar">
<div class="brand">
<div class="logo">B</div>
<div>
<div class="brandName">Bulba AI</div>
<div class="status"><span class="dot"></span><span id="statusText">Online</span></div>
</div>
</div>

<div class="topActions">
<button class="modelBtn" id="modelButton">
<span class="modelName" id="modelName">Auto</span>
<span>⌄</span>
</button>
<button class="iconBtn" id="newChat" aria-label="Новый чат">＋</button>
</div>
</header>

<main id="chat">

<section class="welcome" id="welcome">
<div class="welcomeLogo">B</div>
<h1>Bulba AI</h1>
<p>AI внутри Telegram — модели, изображения, память и полноценные чаты.</p>

<div class="suggestions">
<button class="suggestion" data-suggestion="Объясни мне сложную тему простыми словами">Объясни сложную тему</button>
<button class="suggestion" data-suggestion="Помоги мне решить задачу и объясни решение">Помоги с задачей</button>
<button class="suggestion" data-suggestion="Проанализируй мою идею и предложи улучшения">Разбери мою идею</button>
<button class="suggestion" data-suggestion="Что ты умеешь?">Что ты умеешь?</button>
</div>
</section>

<div id="messages"></div>

</main>

<div class="composerWrap">

<div class="preview" id="preview">
<div class="previewBox">
<img id="previewImage" alt="Фото">
<button class="removePhoto" id="removePhoto">×</button>
</div>
</div>

<div class="composer">
<button class="attach" id="attach" aria-label="Добавить фото">＋</button>

<textarea
id="input"
rows="1"
maxlength="12000"
placeholder="Сообщение..."
></textarea>

<button class="send" id="send" aria-label="Отправить">↑</button>
</div>

</div>
</div>

<input id="file" type="file" accept="image/*">

<div class="overlay" id="overlay">
<div class="sheet" id="sheet">
<div class="handle"></div>
<div class="sheetTitle" id="sheetTitle"></div>
<div id="sheetContent"></div>
</div>
</div>

<div id="toast"></div>

<script>
(() => {
"use strict";

const tg = window.Telegram?.WebApp;

const $ = id => document.getElementById(id);

const chat = $("chat");
const messages = $("messages");
const welcome = $("welcome");
const input = $("input");
const send = $("send");
const file = $("file");
const preview = $("preview");
const previewImage = $("previewImage");
const overlay = $("overlay");
const sheetTitle = $("sheetTitle");
const sheetContent = $("sheetContent");
const toastBox = $("toast");

const S = {
model:"auto",
style:"normal",
activeChat:"main",
chats:[],
memory:{},
requests:0,
errors:0,
models:[],
image:null,
sending:false,
booted:false
};

function haptic(type="light"){
try{
if(tg?.HapticFeedback){
if(type==="medium") tg.HapticFeedback.impactOccurred("medium");
else if(type==="heavy") tg.HapticFeedback.impactOccurred("heavy");
else tg.HapticFeedback.impactOccurred("light");
}
}catch(e){}
}

function toast(text){
toastBox.textContent=String(text||"");
toastBox.classList.add("show");
clearTimeout(toast._timer);
toast._timer=setTimeout(
()=>toastBox.classList.remove("show"),
2600
);
}

function initData(){
return tg?.initData||"";
}

function api(path,options={}){
const controller=new AbortController();
const timeout=setTimeout(
()=>controller.abort(),
options.timeout||30000
);

const headers={
"Content-Type":"application/json",
"X-Telegram-Init-Data":initData(),
...(options.headers||{})
};

return fetch(path,{
...options,
headers,
signal:controller.signal
})
.then(async response=>{
clearTimeout(timeout);

let data=null;

try{
data=await response.json();
}catch(e){
throw new Error(
"Сервер вернул некорректный ответ."
);
}

if(!response.ok||data?.ok===false){
throw new Error(
data?.error||
`Ошибка сервера: ${response.status}`
);
}

return data;
})
.catch(error=>{
clearTimeout(timeout);
throw error;
});
}

function escapeHtml(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function renderMarkdown(text){
let s=escapeHtml(text||"");

const blocks=[];

s=s.replace(
/```([\s\S]*?)```/g,
(_,code)=>{
const token=`@@CODEBLOCK${blocks.length}@@`;
blocks.push(
`<pre><code>${code.trim()}</code></pre>`
);
return token;
}
);

s=s.replace(
/`([^`\n]+)`/g,
"<code>$1</code>"
);

s=s.replace(
/\*\*([^*]+)\*\*/g,
"<strong>$1</strong>"
);

s=s.replace(
/\*([^*\n]+)\*/g,
"<em>$1</em>"
);

s=s.replace(
/^### (.+)$/gm,
"<h3>$1</h3>"
);

s=s.replace(
/^## (.+)$/gm,
"<h2>$1</h2>"
);

s=s.replace(
/^# (.+)$/gm,
"<h1>$1</h1>"
);

s=s.replace(
/^\s*[-•]\s+(.+)$/gm,
"<li>$1</li>"
);

s=s.replace(
/(<li>.*<\/li>)/gs,
"<ul>$1</ul>"
);

s=s.replace(
/\n{2,}/g,
"</p><p>"
);

s=s.replace(
/\n/g,
"<br>"
);

s="<p>"+s+"</p>";

s=s.replace(
/<p>(@@CODEBLOCK\d+@@)<\/p>/g,
"$1"
);

s=s.replace(
/@@CODEBLOCK(\d+)@@/g,
(_,i)=>blocks[Number(i)]
);

return s;
}

function renderMessage(
role,
text,
image=null
){
const row=document.createElement("div");
row.className=`messageRow ${role}`;

const bubble=document.createElement("div");
bubble.className="bubble";

if(image){
const img=document.createElement("img");
img.className="photo";
img.src=image;
img.alt="Изображение";
bubble.appendChild(img);
}

if(text){
if(role==="assistant"){
const md=document.createElement("div");
md.className="md";
md.innerHTML=renderMarkdown(text);
bubble.appendChild(md);
}else{
const textNode=document.createElement("div");
textNode.textContent=text;
bubble.appendChild(textNode);
}
}

if(role==="assistant"&&text){
const copy=document.createElement("button");
copy.className="copyBtn";
copy.textContent="Скопировать";
copy.onclick=async()=>{
try{
await navigator.clipboard.writeText(text);
copy.textContent="Скопировано ✓";
setTimeout(
()=>copy.textContent="Скопировать",
1400
);
haptic("light");
}catch(e){
toast("Не удалось скопировать.");
}
};
bubble.appendChild(copy);
}

row.appendChild(bubble);
messages.appendChild(row);

scrollBottom();
}

function scrollBottom(){
requestAnimationFrame(()=>{
chat.scrollTop=chat.scrollHeight;
});
}

function typing(show){
const old=$("typing");

if(!show){
if(old) old.remove();
return;
}

if(old)return;

const row=document.createElement("div");
row.id="typing";
row.className="messageRow assistant";

row.innerHTML=`
<div class="typing">
<span></span>
<span></span>
<span></span>
</div>
`;

messages.appendChild(row);
scrollBottom();
}

function renderHistory(){
messages.innerHTML="";

const current=S.chats.find(
c=>String(c.id)===String(S.activeChat)
);

if(!current||!current.messages?.length){
welcome.style.display="flex";
return;
}

welcome.style.display="none";

for(const message of current.messages){
renderMessage(
message.role,
message.content||"",
null
);
}
}

function applyState(state){
if(!state)return;

S.model=state.model||"auto";
S.style=state.style||"normal";
S.activeChat=String(
state.active_chat||"main"
);
S.chats=Array.isArray(state.chats)
?state.chats
:[];
S.memory=state.memory||{};
S.requests=Number(state.requests||0);
S.errors=Number(state.errors||0);

updateModelName();
renderHistory();
updateSend();
}

function updateModelName(){
let name=S.model;

if(name==="auto"){
name="Auto";
}

$("modelName").textContent=name;
}

function resize(){
input.style.height="auto";
input.style.height=
Math.min(
input.scrollHeight,
150
)+"px";
}

function updateSend(){
send.disabled=
S.sending||
(
!input.value.trim()&&
!S.image
);
}

function openSheet(title,html){
sheetTitle.textContent=title;
sheetContent.innerHTML=html;
overlay.classList.add("show");
}

function closeSheet(){
overlay.classList.remove("show");
}

function modelSheet(){
let html=`
<div class="sheetSub">
Выбери модель или оставь Auto.
</div>
`;

html+=`
<button
class="modelOption ${S.model==="auto"?"selected":""}"
data-model="auto"
>
<div class="itemLeft">
<div class="itemTitle">⚡ Auto</div>
<div class="itemMeta">Bulba AI выберет доступную модель</div>
</div>
<span class="check">${S.model==="auto"?"✓":""}</span>
</button>
`;

for(const model of S.models){
const id=String(model.id||"");

html+=`
<button
class="modelOption ${S.model===id?"selected":""}"
data-model="${escapeHtml(id)}"
>
<div class="itemLeft">
<div class="itemTitle">${escapeHtml(model.name||id)}</div>
<div class="itemMeta">${escapeHtml(id)}</div>
</div>
<span class="check">${S.model===id?"✓":""}</span>
</button>
`;
}

openSheet(
"🧠 Модель",
html
);

sheetContent
.querySelectorAll("[data-model]")
.forEach(button=>{
button.onclick=async()=>{
try{
const m=button.dataset.model;

const d=await api(
"/api/settings",
{
method:"POST",
body:JSON.stringify({
model:m
})
}
);

applyState(d.state);
closeSheet();
haptic("light");

}catch(e){
toast(e.message);
}
};
});
}

function chatsSheet(){
let html=`
<button class="rowBtn" id="sheetNewChat">
<span class="itemTitle">＋ Новый чат</span>
<span>›</span>
</button>
`;

if(!S.chats.length){
html+=`
<div class="sheetSub">
Чатов пока нет.
</div>
`;
}

for(const c of S.chats){

html+=`
<div
class="chatItem ${String(c.id)===String(S.activeChat)?"selected":""}"
data-chat="${escapeHtml(c.id)}"
>
<div class="itemLeft">
<div class="itemTitle">
${escapeHtml(c.title||"Новый чат")}
</div>
<div class="itemMeta">
${Number(c.requests||0)} запросов
</div>
</div>
<span>›</span>
</div>
`;
}

openSheet(
"💬 Чаты",
html
);

$("sheetNewChat").onclick=()=>{
newChat(true);
};

sheetContent
.querySelectorAll("[data-chat]")
.forEach(el=>{
el.onclick=()=>{
chatActions(
el.dataset.chat
);
};
});
}

function chatActions(id){
const c=S.chats.find(
x=>String(x.id)===String(id)
);

if(!c)return;

openSheet(
c.title||"Чат",
`
<div class="sheetSub">
Управление чатом
</div>

<button class="rowBtn" id="selectChat">
<span>Открыть</span>
<span>›</span>
</button>

<button class="rowBtn" id="renameChat">
<span>✏️ Переименовать</span>
<span>›</span>
</button>

<button class="rowBtn" id="clearChat">
<span>🧹 Очистить историю</span>
<span>›</span>
</button>

<button class="rowBtn danger" id="deleteChat">
<span>🗑 Удалить чат</span>
<span>›</span>
</button>
`
);

$("selectChat").onclick=async()=>{
try{

const d=await api(
"/api/chat/select",
{
method:"POST",
body:JSON.stringify({
chat_id:id
})
}
);

applyState(d.state);
closeSheet();
haptic("light");

}catch(e){
toast(e.message);
}
};

$("renameChat").onclick=()=>{
renameChat(id);
};

$("clearChat").onclick=()=>{
clearChatHistory(id);
};

$("deleteChat").onclick=()=>{
deleteChat(id);
};
}

async function newChat(){
if(S.sending)return;

try{

const d=await api(
"/api/chat/new",
{
method:"POST",
body:"{}"
}
);

applyState(d.state);
closeSheet();

haptic("medium");

input.focus();

}catch(e){
toast(e.message);
}
}

async function clearChatHistory(
id=S.activeChat
){
if(!confirm(
"Очистить историю этого чата?"
)){
return;
}

try{

const d=await api(
"/api/chat/clear",
{
method:"POST",
body:JSON.stringify({
chat_id:id
})
}
);

applyState(d.state);
closeSheet();

haptic("light");

}catch(e){
toast(e.message);
}

async function resizeImage(fileObject){

if(
!("createImageBitmap" in window)
){
return fallbackImage(
fileObject
);
}

const bitmap=
await createImageBitmap(
fileObject
);

const max=1600;

let width=bitmap.width;
let height=bitmap.height;

if(
width>max||
height>max
){

const scale=Math.min(
max/width,
max/height
);

width=Math.round(
width*scale
);

height=Math.round(
height*scale
);
}

const canvas=
document.createElement(
"canvas"
);

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext(
"2d"
);

ctx.drawImage(
bitmap,
0,
0,
width,
height
);

if(bitmap.close){
bitmap.close();
}

return canvas.toDataURL(
"image/jpeg",
0.82
);
}

function fallbackImage(
fileObject
){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=()=>{

const image=
new Image();

image.onload=()=>{

const max=1600;

const scale=Math.min(
1,
max/image.width,
max/image.height
);

const canvas=
document.createElement(
"canvas"
);

canvas.width=
Math.round(
image.width*scale
);

canvas.height=
Math.round(
image.height*scale
);

const ctx=
canvas.getContext("2d");

ctx.drawImage(
image,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.82
)
);
};

image.onerror=reject;

image.src=reader.result;
};

reader.onerror=reject;

reader.readAsDataURL(
fileObject
);

});
}

async function chooseImage(
fileObject
){

if(!fileObject){
return;
}

if(
!fileObject.type.startsWith(
"image/"
)
){

toast(
"Выбери изображение."
);

return;
}

if(
fileObject.size>
8*1024*1024
){

toast(
"Фото слишком большое. Максимум 8 МБ."
);

return;
}

try{

S.image=
await resizeImage(
fileObject
);

previewImage.src=S.image;

preview.classList.add(
"show"
);

updateSend();

haptic("light");

}catch(error){

console.error(error);

toast(
"Не удалось обработать фото."
);
}
}

function removeImage(){

S.image=null;

previewImage.src="";

preview.classList.remove(
"show"
);

updateSend();
}

async function sendMessage(){

if(S.sending){
return;
}

const text=
input.value.trim();

if(
!text&&!S.image
){
return;
}

S.sending=true;

updateSend();

const image=S.image;

input.value="";

resize();

removeImage();

renderMessage(
"user",
text||"",
image
);

typing(true);

try{

const data=
await api(
"/api/chat",
{
method:"POST",
body:JSON.stringify({
message:text,
model:S.model,
chat_id:S.activeChat,
image
}),
timeout:100000
}
);

typing(false);

renderMessage(
"assistant",
data.answer||""
);

applyState(
data.state
);

haptic("light");

}catch(error){

typing(false);

let message=
error?.message||
"Неизвестная ошибка.";

if(
error?.name==="AbortError"
){
message=
"Сервер слишком долго не отвечает.";
}

renderMessage(
"assistant",
"❌ Ошибка: "+message
);

haptic("heavy");

}finally{

S.sending=false;

updateSend();

input.focus();
}
}

modelsResponse.models

applyState(

);

"Не удалось подключиться."
);
}
}
