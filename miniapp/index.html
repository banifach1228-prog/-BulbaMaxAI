<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0c0f">
<title>Bulba AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0c0f;--panel:#121419;--panel2:#191c22;--text:#f4f6fa;--muted:#89909f;--line:rgba(255,255,255,.08);--accent:#5f8cff;--danger:#ff697b;--good:#55d98a;--nav:62px;--composer:72px;--vh:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{overflow:hidden;overscroll-behavior:none}button,input,textarea,select{font:inherit}button{border:0;color:inherit}button:disabled{opacity:.5;pointer-events:none}
#app{height:var(--vh);min-height:100svh;overflow:hidden;position:relative}.top{height:calc(55px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 13px 0;position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;background:rgba(11,12,15,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px}.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-weight:900}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.topbtn{width:35px;height:35px;border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.main{position:absolute;inset:calc(55px + env(safe-area-inset-top)) 0 calc(var(--nav) + env(safe-area-inset-bottom));overflow:hidden}.screen{display:none;height:100%;overflow:auto;-webkit-overflow-scrolling:touch}.screen.active{display:block}.chat{position:relative;overflow:hidden!important}.messages{height:100%;overflow:auto;padding:16px 13px calc(var(--composer) + 18px);scroll-behavior:smooth}.msg{display:flex;margin:0 0 10px}.msg.user{justify-content:flex-end}.bubble{max-width:min(90%,680px);padding:10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.43;font-size:15px}.msg.user .bubble{background:#315fce;border-color:transparent;border-bottom-right-radius:5px}.msg.assistant .bubble{border-bottom-left-radius:5px}.msg.system{justify-content:center}.msg.system .bubble{background:transparent;border:0;color:var(--muted);font-size:12px;text-align:center}.welcome{position:absolute;inset:0 0 calc(var(--composer) + 15px);display:grid;place-items:center;padding:25px;text-align:center;pointer-events:none}.welcome.hide{display:none}.welcome b{display:block;font-size:27px;margin-bottom:6px}.welcome p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.typing{display:flex;gap:4px;padding:4px}.dot{width:6px;height:6px;border-radius:50%;background:#aeb6c8;animation:blink 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.composer{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:6px 10px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);}.suggestions{display:flex;gap:6px;overflow:auto;padding:0 2px 7px;scrollbar-width:none}.suggestions::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;padding:7px 9px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:10px}.composerRow{display:flex;gap:7px;align-items:flex-end}.round{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}.send{background:var(--accent);border:0}.inputWrap{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:6px 9px}.input{width:100%;min-height:27px;max-height:115px;padding:4px 0;border:0;outline:0;resize:none;overflow:auto;background:transparent;color:var(--text);line-height:20px}.filebar{display:none;align-items:center;justify-content:space-between;gap:7px;padding:6px 8px;margin-bottom:6px;background:rgba(95,140,255,.09);border-radius:10px;color:#b8c9ff;font-size:11px}.filebar.show{display:flex}.filebar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:3px 7px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(15,16,20,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.nav button{background:transparent;color:var(--muted);font-size:9px;border-radius:11px}.nav button.active{color:var(--text);background:var(--panel2)}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:1px}
.panel{padding:16px 13px 24px;max-width:760px;margin:auto}.title{font-size:23px;font-weight:800;margin:3px 0 4px}.sub{color:var(--muted);font-size:11px;margin-bottom:14px}.card,.item{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:8px}.item{display:flex;align-items:center;gap:10px;text-align:left;width:100%}.grow{flex:1;min-width:0}.item b{display:block;font-size:13px}.item small{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.35}.arrow{color:var(--muted);font-size:19px}.primary,.secondary{width:100%;min-height:42px;border-radius:12px}.primary{background:var(--accent);font-weight:750}.secondary{background:var(--panel2);border:1px solid var(--line)}.danger{color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.model{padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:left}.model.active{border-color:rgba(95,140,255,.7);background:rgba(95,140,255,.1)}.model b{font-size:11px}.model small{display:block;color:var(--muted);font-size:9px;margin-top:3px;overflow:hidden;text-overflow:ellipsis}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px}.stat b{font-size:19px}.stat small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.field{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:10px;outline:0;margin:4px 0}.field:focus{border-color:rgba(95,140,255,.7)}textarea.field{min-height:90px;resize:vertical}.muted{color:var(--muted);font-size:11px}.empty{padding:22px;text-align:center;color:var(--muted);font-size:11px}.hidden{display:none!important}
.sheetBack{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.58);opacity:0;visibility:hidden;pointer-events:none;transition:.16s}.sheetBack.show{opacity:1;visibility:visible;pointer-events:auto}.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:#15171d;border-radius:21px 21px 0 0;padding:8px 13px calc(16px + env(safe-area-inset-bottom));transform:translateY(15px);transition:transform .18s}.sheetBack.show .sheet{transform:none}.grab{width:36px;height:4px;border-radius:99px;background:#4d535f;margin:2px auto 10px}.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheetHead b{font-size:17px}.close{width:32px;height:32px;border-radius:10px;background:var(--panel2)}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:9px}.tab{height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:9px}.tab.active{border-color:rgba(95,140,255,.7);background:rgba(95,140,255,.1)}.mediaModels{display:grid;gap:6px;max-height:220px;overflow:auto}.mediaModel{padding:9px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);text-align:left}.mediaModel.active{border-color:rgba(95,140,255,.7)}.status{padding:9px;border-radius:11px;background:var(--panel2);font-size:11px;color:var(--muted)}.result{padding:10px;border-radius:11px;background:rgba(85,217,138,.08);border:1px solid rgba(85,217,138,.18);font-size:11px}.result a{color:#a8c4ff;word-break:break-all}.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom));transform:translate(-50%,15px);opacity:0;pointer-events:none;z-index:150;padding:9px 12px;border-radius:11px;background:#252933;border:1px solid var(--line);font-size:11px;transition:.16s;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.grid{grid-template-columns:1fr}.bubble{max-width:92%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
<header class="top">
  <div class="brand">
    <div class="logo">B</div>
    <div><b>Bulba AI</b><small id="online">Подключение…</small></div>
  </div>
  <button class="topbtn" id="newChat" type="button">＋</button>
</header>

<main class="main">
<section class="screen chat active" id="chatScreen">
  <div class="messages" id="messages"></div>
  <div class="welcome" id="welcome">
    <div>
      <b>Чем займёмся?</b>
      <p>Текст, файлы и Media Studio — без лишних экранов.</p>
    </div>
  </div>

  <div class="composer">
    <div class="suggestions">
      <button class="chip" data-p="Объясни мне эту тему простыми словами">Объясни</button>
      <button class="chip" data-p="Реши задачу и объясни решение">Реши</button>
      <button class="chip" data-p="Сделай краткий конспект">Конспект</button>
    </div>

    <div class="filebar" id="filebar">
      <span id="filename"></span>
      <button class="close" id="removeFile">×</button>
    </div>

    <div class="composerRow">
      <button class="round" id="attach">📎</button>
      <div class="inputWrap">
        <textarea class="input" id="input" rows="1" placeholder="Сообщение…"></textarea>
      </div>
      <button class="round send" id="send">➤</button>
    </div>

    <input id="file" type="file" hidden>
  </div>
</section>

<section class="screen" id="chatsScreen">
  <div class="panel">
    <div class="title">Чаты</div>
    <div class="sub">Все твои диалоги</div>
    <div id="chatList"></div>
  </div>
</section>

<section class="screen" id="mediaScreen">
  <div class="panel">
    <div class="title">Media Studio</div>
    <div class="sub">Генерация изображений, видео, TTS, музыки и 3D через доступные модели.</div>
    <button class="primary" id="openMedia">Открыть Media Studio</button>
  </div>
</section>

<section class="screen" id="settingsScreen">
  <div class="panel">
    <div class="title">Настройки</div>
    <div class="sub">Модель и стиль ответа</div>

    <div class="card">
      <b style="font-size:13px">Модель</b>
      <div class="grid" id="models" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <b style="font-size:13px">Стиль</b>
      <select class="field" id="style">
        <option value="balanced">Сбалансированный</option>
        <option value="short">Короткий</option>
        <option value="detailed">Подробный</option>
        <option value="friendly">Дружелюбный</option>
        <option value="strict">Строгий</option>
      </select>
    </div>

    <button class="primary" id="saveSettings">Сохранить</button>
  </div>
</section>

<section class="screen" id="profileScreen">
  <div class="panel">
    <div class="title">Профиль</div>
    <div class="sub" id="profileSub">Загрузка…</div>

    <div class="statgrid" id="stats"></div>

    <div class="card" style="margin-top:8px">
      <button class="item" id="memory">
        <div class="grow"><b>Память</b><small>Что Bulba AI запомнил о тебе</small></div>
        <span class="arrow">›</span>
      </button>

      <button class="item" id="favoritesBtn">
        <div class="grow"><b>Избранное</b><small>Сохранённые ответы</small></div>
        <span class="arrow">›</span>
      </button>

      <button class="item" id="activate">
        <div class="grow"><b>Активировать лицензию</b><small>Введи код доступа</small></div>
        <span class="arrow">›</span>
      </button>

      <button class="item" id="clearChat">
        <div class="grow"><b>Очистить чат</b><small>Удалить сообщения текущего диалога</small></div>
        <span class="arrow">›</span>
      </button>
    </div>

    <div id="adminPanel"></div>
  </div>
</section>
</main>

<nav class="nav">
  <button class="active" data-screen="chatScreen"><i>💬</i>Чат</button>
  <button data-screen="chatsScreen"><i>🗂</i>Чаты</button>
  <button data-screen="mediaScreen"><i>✨</i>Медиа</button>
  <button data-screen="settingsScreen"><i>⚙️</i>Настройки</button>
  <button data-screen="profileScreen"><i>👤</i>Профиль</button>
</nav>
</div>

<div class="sheetBack" id="sheetBack">
  <div class="sheet">
    <div class="grab"></div>
    <div class="sheetHead">
      <b id="sheetTitle"></b>
      <button class="close" id="close">×</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';

const tg=window.Telegram?.WebApp;
if(tg){
  tg.ready();
  tg.expand();
  try{tg.setHeaderColor('#0b0c0f')}catch{}
  try{tg.setBackgroundColor('#0b0c0f')}catch{}
}

const $=id=>document.getElementById(id);

const state={
  data:null,
  selectedModel:null,
  mediaKind:'image',
  mediaModels:[],
  mediaModel:null,
  file:null,
  sending:false,
  generating:false
};

function haptic(type='light'){
  try{tg?.HapticFeedback?.impactOccurred(type)}catch{}
}

function toast(text){
  const el=$('toast');
  el.textContent=text;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>el.classList.remove('show'),2200);
}

function esc(v){
  return String(v??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function setViewport(){
  const vv=window.visualViewport;
  const h=vv?.height||window.innerHeight;
  document.documentElement.style.setProperty('--vh',`${h}px`);
}

window.addEventListener('resize',setViewport,{passive:true});
window.visualViewport?.addEventListener('resize',setViewport,{passive:true});
setViewport();

async function api(url,opts={}){
  const headers={
    'Content-Type':'application/json',
    ...(opts.headers||{})
  };

  if(tg?.initData){
    headers['X-Telegram-Init-Data']=tg.initData;
  }

  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),opts.timeout||25000);

  try{
    const res=await fetch(url,{
      ...opts,
      headers,
      signal:controller.signal
    });

    const text=await res.text();
    let data={};

    try{
      data=text?JSON.parse(text):{};
    }catch{
      data={message:text};
    }

    if(!res.ok){
      throw new Error(data.error||data.message||`HTTP ${res.status}`);
    }

    return data;
  }catch(e){
    if(e.name==='AbortError')throw new Error('Сервер не отвечает');
    throw e;
  }finally{
    clearTimeout(timeout);
  }
}

function renderMessages(){
  const box=$('messages');
  const messages=state.data?.messages||[];

  box.innerHTML='';

  if(!messages.length){
    $('welcome').classList.remove('hide');
    return;
  }

  $('welcome').classList.add('hide');

  const frag=document.createDocumentFragment();

  messages.forEach(m=>{
    const row=document.createElement('div');
    const role=m.role||'assistant';

    row.className=`msg ${role}`;

    const bubble=document.createElement('div');
    bubble.className='bubble';
    bubble.textContent=m.content||m.text||'';

    row.appendChild(bubble);
    frag.appendChild(row);
  });

  box.appendChild(frag);

  requestAnimationFrame(()=>{
    box.scrollTop=box.scrollHeight;
  });
}

function renderChats(chats){
  const box=$('chatList');
  box.innerHTML='';

  if(!chats.length){
    box.innerHTML='<div class="empty">Чатов пока нет.</div>';
    return;
  }

  const frag=document.createDocumentFragment();

  chats.forEach(c=>{
    const b=document.createElement('button');
    b.className='item';

    b.innerHTML=`
      <div class="grow">
        <b>${esc(c.title||'Новый чат')}</b>
        <small>${esc(c.preview||'Нет сообщений')}</small>
      </div>
      <span class="arrow">›</span>
    `;

    b.onclick=()=>selectChat(c.id);
    frag.appendChild(b);
  });

  box.appendChild(frag);
}

function renderModels(models){
  const box=$('models');
  box.innerHTML='';

  if(!models?.length){
    box.innerHTML='<div class="empty">Модели недоступны.</div>';
    return;
  }

  models.forEach(m=>{
    const b=document.createElement('button');

    b.className='model';
    if(m.id===state.selectedModel)b.classList.add('active');

    b.innerHTML=`
      <b>${esc(m.name||m.id)}</b>
      <small>${esc(m.description||m.id)}</small>
    `;

    b.onclick=()=>{
      state.selectedModel=m.id;
      renderModels(models);
      haptic('light');
    };

    box.appendChild(b);
  });
}

async function loadModels(){
  try{
    const d=await api('/api/models');

    const models=d.models||[];

    if(!state.selectedModel){
      state.selectedModel=d.selected_model||state.data?.model||models[0]?.id||'auto';
    }

    renderModels(models);

    if(state.data?.style){
      $('style').value=state.data.style;
    }
  }catch(e){
    $('models').innerHTML=`<div class="status">${esc(e.message)}</div>`;
  }
}

function renderProfile(){
  const d=state.data||{};
  const user=d.user||{};

  $('profileSub').textContent=
    user.username?`@${user.username}`:
    user.first_name||`ID ${user.id||''}`;

  const s=d.stats||{};

  $('stats').innerHTML=`
    <div class="stat"><b>${esc(s.requests??d.requests_left??0)}</b><small>Запросов</small></div>
    <div class="stat"><b>${esc(s.chats??d.chats?.length??0)}</b><small>Чатов</small></div>
    <div class="stat"><b>${esc(s.favorites??d.favorites?.length??0)}</b><small>Избранных</small></div>
    <div class="stat"><b>${esc(s.memory??Object.keys(d.memory||{}).length)}</b><small>Записей памяти</small></div>
  `;

  const admin=d.admin;

  if(admin){
    $('adminPanel').innerHTML=`
      <div class="card">
        <b style="font-size:13px">Админ</b>
        <button class="item" id="rules">
          <div class="grow"><b>Правила</b><small>Автоматические ответы</small></div>
          <span class="arrow">›</span>
        </button>
        <button class="item" id="adminStats">
          <div class="grow"><b>Статистика</b><small>Общая статистика бота</small></div>
          <span class="arrow">›</span>
        </button>
        <button class="item" id="adminLicense">
          <div class="grow"><b>Выдать лицензию</b><small>Создать код пользователю</small></div>
          <span class="arrow">›</span>
        </button>
      </div>
    `;

    $('rules').onclick=()=>adminAction('rules');
    $('adminStats').onclick=()=>adminAction('stats');
    $('adminLicense').onclick=()=>adminAction('license');
  }else{
    $('adminPanel').innerHTML='';
  }
}

async function refresh(){
  try{
    const d=await api('/api/state');

    state.data=d.state||d;

    $('online').textContent='Онлайн';

    renderMessages();

    if(document.getElementById('chatsScreen').classList.contains('active')){
      renderChats(state.data.chats||[]);
    }

    if(document.getElementById('profileScreen').classList.contains('active')){
      renderProfile();
    }

    if(document.getElementById('settingsScreen').classList.contains('active')){
      loadModels();
    }

    if(!state.selectedModel){
      state.selectedModel=state.data.model||'auto';
    }
  }catch(e){
    $('online').textContent='Нет соединения';
    toast(e.message);
  }
}

function resize(){
  const input=$('input');

  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,115)+'px';
}

function removeFile(){
  state.file=null;
  $('file').value='';
  $('filename').textContent='';
  $('filebar').classList.remove('show');
}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('Не удалось прочитать файл'));

    reader.readAsDataURL(file);
  });
}

async function send(){
  if(state.sending)return;

  const text=$('input').value.trim();

  if(!text&&!state.file)return;

  state.sending=true;
  $('send').disabled=true;

  const payload={text};

  try{
    if(state.file){
      if(state.file.size>15*1024*1024){
        throw new Error('Файл слишком большой');
      }

      payload.file_name=state.file.name;
      payload.file_data=await fileToDataURL(state.file);
    }

    $('input').value='';
    resize();

    const typing=document.createElement('div');
    typing.className='msg assistant';
    typing.id='typing';

    typing.innerHTML=`
      <div class="bubble">
        <div class="typing">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    `;

    $('messages').appendChild(typing);
    $('messages').scrollTop=$('messages').scrollHeight;

    removeFile();

    await api('/api/chat',{
      method:'POST',
      body:JSON.stringify(payload),
      timeout:60000
    });

    $('typing')?.remove();

    await refresh();

    haptic('light');
  }catch(e){
    $('typing')?.remove();
    toast(e.message);
  }finally{
    state.sending=false;
    $('send').disabled=false;
  }
}

function screen(id){

    .forEach(x=>x.classList.toggle('active',x.id===id));

    .forEach(x=>x.classList.toggle('active',x.dataset.screen===id));

  if(id==='chatsScreen'){
    renderChats(state.data?.chats||[]);

async function openMemory(){

  let h='<div class="card">';

  const keys=Object.keys(mem);

  if(!keys.length){
    h+='<div class="empty">Память пуста.</div>';
  }else{
    keys.forEach(k=>{
      h+=`
        <div class="item">
          <div class="grow">
            <b>${esc(k)}</b>
            <small>${esc(mem[k])}</small>
          </div>
          <button class="close" data-delmem="${esc(k)}">×</button>
        </div>
      `;
    });
  }

  h+=`
    </div>
    <input class="field" id="memKey" placeholder="Ключ">
    <input class="field" id="memValue" placeholder="Значение">
    <button class="primary" id="memSave">Сохранить</button>
    <button class="secondary" id="memClear" style="margin-top:6px">Очистить память</button>
  `;

  openSheet('Память',h);

  document.querySelectorAll('[data-delmem]').forEach(b=>{
    b.onclick=async()=>{
      try{
        await api('/api/memory',{
          method:'POST',
          body:JSON.stringify({
            action:'delete',
            key:b.dataset.delmem
          })
        });

        await refresh();
        openMemory();
      }catch(e){
        toast(e.message);
      }
    };
  });

  $('memSave').onclick=async()=>{
    try{
      await api('/api/memory',{
        method:'POST',
        body:JSON.stringify({
          action:'set',
          key:$('memKey').value,
          value:$('memValue').value
        })
      });

      await refresh();
      openMemory();
    }catch(e){
      toast(e.message);
    }
  };

  $('memClear').onclick=async()=>{
    try{
      await api('/api/memory',{
        method:'POST',
        body:JSON.stringify({action:'clear'})
      });

      await refresh();
      openMemory();
    }catch(e){
      toast(e.message);
    }
  };
}

async function mediaModels(kind){
  state.mediaKind=kind;

  try{
    const d=await api('/api/media/models');

    state.mediaModels=(d.models||[])
      .filter(x=>x.kind===kind);

    renderMediaModels();
  }catch(e){
    $('mediaModels').innerHTML=
      `<div class="status">${esc(e.message)}</div>`;
  }
}

function renderMediaModels(){
  const box=$('mediaModels');

  box.innerHTML='';

  if(!state.mediaModels.length){
    box.innerHTML='<div class="status">Модели недоступны.</div>';
    state.mediaModel=null;
    return;
  }

  state.mediaModel=state.mediaModels[0];

  state.mediaModels.forEach(m=>{
    const b=document.createElement('button');

    b.className='mediaModel '+
      (m.id===state.mediaModel?.id?'active':'');

    b.innerHTML=`
      <b>${esc(m.name||m.id)}</b>
      <div class="muted">${esc(m.id)}</div>
    `;

    b.onclick=()=>{
      state.mediaModel=m;

      document.querySelectorAll('.mediaModel')
        .forEach(x=>x.classList.remove('active'));

      b.classList.add('active');
    };

    box.appendChild(b);
  });
}

  openSheet(
    'Media Studio',
    `
      <div class="tabs">

        <button class="tab" data-kind="video">Видео</button>
        <button class="tab" data-kind="tts">TTS</button>

      ></textarea>

        max="120"

      >

      </button>

async function generateMedia(){
  if(state.generating)return;

  const prompt=$('mediaPrompt').value.trim();

  if(!prompt){
    toast('Напиши промпт');
    return;
  }

  if(!state.mediaModel){
    toast('Выбери модель');
    return;
  }

  state.generating=true;
  $('generateMedia').disabled=true;
  $('mediaStatus').classList.remove('hidden');
  $('mediaStatus').textContent='Создаём…';

  try{
    const opts={};

    if($('mediaDuration').value){
      opts.duration=Number($('mediaDuration').value);
    }

    const d=await api('/api/media/generate',{
      method:'POST',
      body:JSON.stringify({
        kind:state.mediaKind,
        model:state.mediaModel.id,
        prompt,
        opts
      }),
      timeout:35000
    });

    await pollMedia(d.job_id);
  }catch(e){
    $('mediaStatus').textContent=e.message;
  }finally{
    state.generating=false;
    $('generateMedia').disabled=false;
  }
}

async function pollMedia(id){
  for(let i=0;i<240;i++){
    const d=await api(
      '/api/media/jobs/'+encodeURIComponent(id)
    );

    if(d.status==='success'){
      const urls=d.urls||[];

      $('mediaStatus').textContent='Готово';

      $('mediaResult').innerHTML=urls.length
        ? `<div class="result">
            ${urls.map(u=>`
              <div>
                <a
                  href="${esc(u)}"
                  target="_blank"
                  rel="noopener"
                >Открыть результат</a>
              </div>
            `).join('')}
          </div>`
        : '<div class="result">Готово, но ссылка не вернулась.</div>';

      haptic('light');
      return;
    }

    if(d.status==='failed'){
      throw new Error(
        d.error||'Генерация завершилась ошибкой'
      );
    }

    $('mediaStatus').textContent=
      d.status==='processing'
        ? 'Генерация…'
        : 'Подготовка…';

    await new Promise(r=>setTimeout(r,1500));
  }

  throw new Error('Превышено время ожидания');
}

async function adminAction(type){
  let html='';

  if(type==='rules'){
    const d=await api('/api/admin/rules');

    html=`
      <div class="card">
        ${(d.rules||[]).map(r=>`
          <div class="item">
            <div class="grow">
              <b>${esc(r.pattern)}</b>
              <small>${esc(r.response)}</small>
            </div>
            <button class="close" data-rule="${esc(r.id)}">×</button>
          </div>
        `).join('')}
      </div>

      <input class="field" id="rp" placeholder="Фраза">

      <textarea
        class="field"
        id="rr"
        placeholder="Ответ"
      ></textarea>

      <button class="primary" id="ra">Добавить</button>
    `;
  }else if(type==='stats'){
    const d=await api('/api/admin/stats');

    const s=d.stats||{};

    html=`
      <div class="card">
        Пользователей: ${esc(s.users??0)}<br>
        Запросов: ${esc(s.requests??0)}<br>
        Ошибок: ${esc(s.errors??0)}<br>
        Правил: ${esc(s.rules??0)}
      </div>
    `;
  }else{
    html=`
      <input class="field" id="target" placeholder="USER_ID">
      <input class="field" id="days" type="number" placeholder="Дни">
      <input
        class="field"
        id="limit"
        type="number"
        placeholder="Лимит запросов, 0 = без лимита"
      >
      <button class="primary" id="give">Выдать</button>
    `;
  }

  openSheet('Админ',html);

  if(type==='rules'){
    document.querySelectorAll('[data-rule]').forEach(b=>{
      b.onclick=async()=>{
        try{
          await api('/api/admin/rules',{
            method:'POST',
            body:JSON.stringify({
              action:'delete',
              id:b.dataset.rule
            })
          });

          adminAction('rules');
        }catch(e){
          toast(e.message);
        }
      };
    });

    $('ra').onclick=async()=>{
      try{
        await api('/api/admin/rules',{
          method:'POST',
          body:JSON.stringify({
            action:'add',
            pattern:$('rp').value,
            response:$('rr').value,
            mode:'contains'
          })
        });

        adminAction('rules');
      }catch(e){
        toast(e.message);
      }
    };
  }

  if(type==='license'){
    $('give').onclick=async()=>{
      try{
        const d=await api('/api/admin/license',{
          method:'POST',
          body:JSON.stringify({
            user_id:$('target').value,
            days:Number($('days').value),
            requests:Number($('limit').value||0)
          })
        });

        toast(d.code||d.message||'Готово');
        closeSheet();
      }catch(e){
        toast(e.message);
      }
    };
  }
}
