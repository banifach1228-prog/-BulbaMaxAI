<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0c10">
<title>Bulba AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0c10;--panel:#12141a;--panel2:#191c23;--text:#f5f7fb;--muted:#9299a8;--line:rgba(255,255,255,.08);--accent:#5e8cff;--accent2:#7b61ff;--bubble:#171a21;--good:#55d98a;--danger:#ff667a;--shadow:0 18px 50px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{padding-bottom:calc(146px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,textarea{font:inherit}
button{border:0;color:inherit;cursor:pointer}
#app{min-height:100vh}
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(11,12,16,.84);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(94,140,255,.25);font-weight:900}
.brand b{font-size:17px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.iconBtn{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.screen{padding:14px 14px 20px;max-width:760px;margin:auto}
.hero{padding:22px 4px 12px}
.hero h1{font-size:29px;letter-spacing:-1px;margin:0 0 7px}
.hero p{margin:0;color:var(--muted);line-height:1.45}
.suggestions{display:flex;gap:8px;overflow:auto;padding:8px 0 14px;scrollbar-width:none}
.suggestions::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:10px 13px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:#dce2ed}
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.msg{max-width:92%;display:flex;flex-direction:column;gap:5px;animation:up .18s ease}
.msg.user{align-self:flex-end}
.msg.assistant{align-self:flex-start}
.bubble{padding:12px 14px;border-radius:18px;background:var(--bubble);border:1px solid var(--line);line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere}
.user .bubble{background:linear-gradient(135deg,#2b55a6,#3f49a5);border-color:transparent}
.meta{font-size:10px;color:var(--muted);padding:0 4px}
.typing{display:none;gap:5px;align-items:center;color:var(--muted);font-size:12px}
.typing.show{display:flex}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
.composerWrap{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(11,12,16,.96) 24%)}
.composer{max-width:760px;margin:auto;display:flex;gap:8px;align-items:flex-end;padding:7px;border:1px solid var(--line);border-radius:22px;background:rgba(25,28,35,.94);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.composer textarea{flex:1;resize:none;min-height:42px;max-height:130px;background:transparent;border:0;outline:0;color:var(--text);padding:10px 7px}
.round{width:42px;height:42px;border-radius:15px;background:var(--panel2);display:grid;place-items:center}
.send{background:var(--accent);font-size:18px}
.send:disabled{opacity:.4}
.bottom{position:fixed;left:0;right:0;bottom:0;height:0;z-index:25;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.52);display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheetCard{width:100%;max-height:88vh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:sheet .22s ease}
.grab{width:42px;height:5px;border-radius:5px;background:#3a3e48;margin:2px auto 12px}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheetHead h2{font-size:20px;margin:0}
.close{background:var(--panel2);width:34px;height:34px;border-radius:12px}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1}
.row b{display:block}
.row small{color:var(--muted);display:block;margin-top:3px}
.row .arrow{color:var(--muted);font-size:20px}
.nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:40;display:flex;justify-content:space-around;background:rgba(18,20,26,.92);border:1px solid var(--line);border-radius:20px;padding:6px;backdrop-filter:blur(20px);box-shadow:var(--shadow)}
.nav button{background:transparent;color:var(--muted);padding:7px 10px;border-radius:14px;font-size:11px}
.nav button.active{color:var(--text);background:var(--panel2)}
.nav span{display:block;font-size:18px;margin-bottom:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0}
.sectionTitle{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:18px 3px 8px}
.primary{width:100%;padding:13px 15px;border-radius:15px;background:var(--accent);font-weight:700}
.secondary{width:100%;padding:13px 15px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);margin-top:8px}
.danger{color:var(--danger)}
input.field,textarea.field{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;outline:0;margin:5px 0}
.filePreview{display:none;position:fixed;left:12px;right:12px;bottom:calc(128px + env(safe-area-inset-bottom));z-index:32;max-width:760px;margin:auto;gap:8px;align-items:center;padding:8px 5px}
.filePreview.show{display:flex}
.fileTag{padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;font-size:12px;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:35px 12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#f1f3f7;color:#111;padding:10px 14px;border-radius:13px;opacity:0;pointer-events:none;z-index:100;font-size:13px;box-shadow:var(--shadow);transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.adminBadge{color:#ffd76a;font-size:11px;margin-left:5px}
.hidden{display:none!important}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media(min-width:700px){
.nav{max-width:560px;left:50%;right:auto;width:560px;transform:translateX(-50%)}
.composerWrap{padding-left:calc((100vw - 760px)/2);padding-right:calc((100vw - 760px)/2)}
}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="brand" id="brand"><div class="logo">B</div><div><b>Bulba AI <span id="adminBadge" class="adminBadge hidden">ADMIN</span></b><small id="status">V17 • готов</small></div></div><button class="iconBtn" id="profileBtn">👤</button></header>
<main class="screen">
<section class="hero" id="hero"><h1>Чем займёмся?</h1><p>Один запрос — Bulba AI сам выбирает подходящий способ обработки.</p></section>
<div class="suggestions" id="suggestions"><button class="chip" data-q="Объясни простыми словами">🧠 Объяснить</button><button class="chip" data-q="Реши задачу и покажи решение">✏️ Решить</button><button class="chip" data-q="Переведи на английский">🌐 Перевести</button><button class="chip" data-q="Напиши код для">💻 Код</button><button class="chip" data-q="Сделай краткое резюме">⚡ Кратко</button></div>
<div id="chat" class="chat"></div><div id="typing" class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>Bulba AI думает…</span></div>
</main>
<div class="filePreview" id="filePreview"><div class="fileTag" id="fileName"></div><button class="close" id="removeFile">×</button></div>
<div class="composerWrap"><div class="composer"><button class="round" id="attach">＋</button><textarea id="input" placeholder="Напиши сообщение…" rows="1"></textarea><button class="round send" id="send" disabled>↑</button></div></div>
<nav class="nav"><button class="active" data-tab="chatTab"><span>💬</span>Чат</button><button data-tab="chatsTab"><span>🗂</span>Чаты</button><button data-tab="memoryTab"><span>💾</span>Память</button><button data-tab="settingsTab"><span>⚙️</span>Настройки</button></nav>
</div>
<input id="file" type="file" hidden accept="image/*,.txt,.md,.json,.csv,.log,.py,.js,.html,.css,.xlsx,.pdf,.docx">
<div id="sheet" class="sheet"><div class="sheetCard" id="sheetCard"></div></div><div id="toast" class="toast"></div>
<script>
(()=>{
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand?.();
const $=id=>document.getElementById(id); const chat=$('chat'),input=$('input'),send=$('send'),file=$('file'),sheet=$('sheet'),sheetCard=$('sheetCard'),toastEl=$('toast');
const S={state:null,models:[],sending:false,init:tg?.initData||'',file:null,requestId:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),2300)}
function haptic(type='light'){try{tg?.HapticFeedback?.impactOccurred(type)}catch{}}
async function api(path,opt={}){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),opt.timeout||35000);try{const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':S.init,...(opt.headers||{})},signal:ctrl.signal});const d=await r.json().catch(()=>({error:'Некорректный ответ сервера'}));if(!r.ok)throw new Error(d.error||d.message||'Ошибка сервера');return d}finally{clearTimeout(timer)}}
function closeSheet(){sheet.classList.remove('show');sheetCard.innerHTML=''}
function openSheet(title,html){sheetCard.innerHTML=`<div class="grab"></div><div class="sheetHead"><h2>${esc(title)}</h2><button class="close" id="closeSheet">×</button></div>${html}`;sheet.classList.add('show');$('closeSheet').onclick=closeSheet}
sheet.onclick=e=>{if(e.target===sheet)closeSheet()}
function applyState(state){S.state=state;$('status').textContent=`${state.version} • ${state.license?.active?'доступ активен':'доступ ограничен'}`;$('adminBadge').classList.toggle('hidden',!state.is_admin);renderChat(((state.chats||[]).find(c=>c.id===state.active_chat)||{}).messages||[]);updateSend()}
function renderChat(history){chat.innerHTML='';if(!history.length){$('hero').classList.remove('hidden');$('suggestions').classList.remove('hidden');return}$('hero').classList.add('hidden');$('suggestions').classList.add('hidden');for(const m of history){if(!['user','assistant'].includes(m.role))continue;addBubble(m.role,m.content,false)}scrollBottom()}
function addBubble(role,text,scroll=true){const el=document.createElement('div');el.className='msg '+role;el.innerHTML=`<div class="bubble">${esc(text)}</div><div class="meta">${role==='user'?'Вы':'Bulba AI'}</div>${role==='assistant'?'<button class="secondary" data-save-answer>⭐ Сохранить</button>':''}`;chat.appendChild(el);if(role==='assistant'){el.querySelector('[data-save-answer]').onclick=async()=>{const d=await action('/api/favorite',{answer:text});if(d?.ok)toast('Сохранено в избранное')}}if(scroll)scrollBottom()}
function scrollBottom(){requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px';updateSend()}
function updateSend(){send.disabled=S.sending||(!input.value.trim()&&!S.file)}
async function load(){if(!S.init){toast('Открой Mini App через Telegram.');return}try{const [a,b]=await Promise.all([api('/api/state'),api('/api/models')]);S.models=b.models||[];applyState(a.state)}catch(e){$('status').textContent='Ошибка подключения';toast(e.message)}}
function newRequestId(){return `${Date.now()}-${Math.random().toString(36).slice(2)}`}
async function pollMediaJob(jobId,timeoutMs=660000){const started=Date.now();while(Date.now()-started<timeoutMs){const d=await api('/api/media/jobs/'+encodeURIComponent(jobId),{timeout:35000});if(!d)return null;if(d.status==='success')return d;if(d.status==='failed')throw new Error(d.error||'Медиа-задача завершилась ошибкой.');await new Promise(r=>setTimeout(r,3000));}throw new Error('Медиа-задача выполняется слишком долго.')}
function mediaResultHtml(d,kind){let html=`<div class="card"><b>✅ Готово</b><small>${esc(d.model||'Auto')}</small></div>`;if(d.text)html+=`<div class="card">${esc(d.text)}</div>`;for(const u of (d.urls||[])){if(kind==='image')html+=`<img src="${esc(u)}" style="width:100%;border-radius:16px;margin-top:8px">`;else if(kind==='video')html+=`<video src="${esc(u)}" controls playsinline style="width:100%;border-radius:16px;margin-top:8px"></video>`;else if(kind==='tts'||kind==='music')html+=`<audio src="${esc(u)}" controls style="width:100%;margin-top:8px"></audio>`;else html+=`<a class="primary" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="${esc(u)}" target="_blank">Открыть 3D-файл</a>`}return html}
async function sendMessage(){if(S.sending)return;const text=input.value.trim();if(!text&&!S.file)return;S.sending=true;updateSend();const f=S.file;input.value='';resize();clearFile();addBubble('user',text||`[${f?.name||'файл'}]`);$('typing').classList.add('show');try{const body={message:text,model:S.state?.model||'auto',chat_id:S.state?.active_chat,request_id:newRequestId()};if(f){if(f.kind==='image')body.image=f.data;else body.file={name:f.name,data:f.data}}const d=await api('/api/chat',{method:'POST',body:JSON.stringify(body),timeout:35000});if(d.job_id){$('typing').classList.remove('show');addBubble('assistant','⏳ Медиа-задача запущена. Генерация продолжается…');const done=await pollMediaJob(d.job_id);if(done){addBubble('assistant',mediaResultHtml(done,done.kind));applyState(done.state||S.state)}}else{$('typing').classList.remove('show');addBubble('assistant',d.answer||'');applyState(d.state);if(d.file)downloadFile(d.file)}haptic('light')}catch(e){$('typing').classList.remove('show');addBubble('assistant','❌ '+(e.name==='AbortError'?'Сервер слишком долго не отвечает.':e.message));haptic('heavy')}finally{S.sending=false;updateSend();input.focus()}}
function downloadFile(f){try{const a=document.createElement('a');a.href=`data:${f.mime};base64,${f.data}`;a.download=f.name;a.click();toast(`Файл ${f.name} готов`)}catch{toast('Файл создан, но скачать его не удалось')}}
function clearFile(){S.file=null;$('filePreview').classList.remove('show');$('fileName').textContent='';file.value='';updateSend()}
function imageData(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}
async function chooseFile(f){if(!f)return;if(f.size===0){toast('Файл пустой');return}if(f.size>10*1024*1024){toast('Файл больше 10 МБ');return}try{const data=await imageData(f);S.file={name:f.name,data,kind:f.type.startsWith('image/')?'image':'file'};$('fileName').textContent=f.name;$('filePreview').classList.add('show');updateSend();haptic('light')}catch{toast('Не удалось прочитать файл')}}
function chatsSheet(){const rows=(S.state?.chats||[]).map(c=>`<button class="row" data-chat="${esc(c.id)}"><div class="grow"><b>${c.pinned?'📌 ':''}${esc(c.title)}</b><small>${c.requests} запросов</small></div><span class="arrow">${c.active?'✓':'›'}</span></button>`).join('');openSheet('Чаты',`${rows||'<div class="empty">Чатов пока нет</div>'}<button class="primary" id="newChatSheet">＋ Новый чат</button>`);document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=async()=>{await action('/api/chat/select',{chat_id:b.dataset.chat});closeSheet()});$('newChatSheet').onclick=async()=>{await action('/api/chat/new');closeSheet()}}
async function action(path,body){try{const d=await api(path,{method:'POST',body:JSON.stringify(body||{})});if(d.state)applyState(d.state);haptic('light');return d}catch(e){toast(e.message)}}
function memorySheet(){const mem=S.state?.memory||{};const rows=Object.entries(mem).map(([k,v])=>`<div class="row"><div class="grow"><b>${esc(k)}</b><small>${esc(v)}</small></div><button class="close danger" data-delmem="${esc(k)}">×</button></div>`).join('');openSheet('Память',`${rows||'<div class="empty">Память пуста</div>'}<div class="sectionTitle">Добавить</div><input class="field" id="memKey" placeholder="Название"><input class="field" id="memVal" placeholder="Значение"><button class="primary" id="memAdd">Сохранить</button><button class="secondary" id="memClear">Очистить память</button>`);document.querySelectorAll('[data-delmem]').forEach(b=>b.onclick=async()=>{await action('/api/memory',{action:'delete',key:b.dataset.delmem});memorySheet()});$('memAdd').onclick=async()=>{await action('/api/memory',{action:'set',key:$('memKey').value,value:$('memVal').value});memorySheet()};$('memClear').onclick=async()=>{await action('/api/memory',{action:'clear'});memorySheet()}}
async function mediaSheet(){
  let models=[];
  try{const d=await api('/api/media/models');models=d.models||[]}catch(e){toast(e.message)}
  const groups=[['image','🖼️ Изображение'],['video','🎬 Видео'],['tts','🔊 Голос'],['music','🎵 Музыка'],['3d','🧊 3D']];
  const cards=groups.map(([k,t])=>`<button class="row" data-media-kind="${k}"><div class="grow"><b>${t}</b><small>${models.filter(x=>x.kind===k).length} моделей доступно</small></div><span class="arrow">›</span></button>`).join('');
  openSheet('Media Studio',`${cards}<div class="card"><b>Авто</b><small>Если модель не выбрать, Bulba сам возьмёт подходящую и обычно самую экономичную доступную.</small></div>`);
  document.querySelectorAll('[data-media-kind]').forEach(b=>b.onclick=()=>mediaForm(b.dataset.mediaKind,models));
}
function paramValues(item,key){const p=item?.params||{};const v=p[key];if(Array.isArray(v))return v;if(v&&typeof v==='object')return v.values||v.options||v.enum||v.choices||[];return []}
function buildParamSelect(label,key,values,def){if(!values.length)return '';const options=values.map(v=>`<option value="${esc(v)}" ${String(v)===String(def)?'selected':''}>${esc(v)}</option>`).join('');return `<div class="sectionTitle">${esc(label)}</div><select class="field" id="media_${esc(key)}">${options}</select>`}
function mediaForm(kind,models){
  const titles={image:'🖼️ Изображение',video:'🎬 Видео',tts:'🔊 Голос',music:'🎵 Музыка','3d':'🧊 3D'};
  const list=models.filter(x=>x.kind===kind);
  const opts=list.map(x=>`<option value="${esc(x.id)}">${esc(x.id)}${x.fromRub!=null?` — от ${esc(x.fromRub)} ₽`:''}</option>`).join('');
  const selected=()=>list.find(x=>x.id===$('mediaModel')?.value)||list[0]||null;
  const renderParams=()=>{const item=selected();if(!item)return '';const p=[];const labels={aspect_ratio:'Соотношение',duration:'Длительность',resolution:'Разрешение',quality:'Качество',mode:'Режим',voice:'Голос'};for(const [k,label] of Object.entries(labels)){const vals=paramValues(item,k);if(vals.length)p.push(buildParamSelect(label,k,vals,vals.includes(k==='aspect_ratio'?'1:1':k==='duration'?'5':k==='resolution'?'720p':k==='quality'?'medium':undefined)?(k==='aspect_ratio'?'1:1':k==='duration'?'5':k==='resolution'?'720p':k==='quality'?'medium':vals[0]):vals[0]))}return p.join('')};
  openSheet(titles[kind],`<textarea class="field" id="mediaPrompt" rows="5" placeholder="Опиши, что нужно создать…"></textarea><select class="field" id="mediaModel"><option value="">🤖 Auto</option>${opts}</select><div id="mediaParams">${renderParams()}</div><button class="primary" id="mediaGenerate">Создать</button><button class="secondary" id="mediaBack">← Назад</button>`);
  $('mediaBack').onclick=()=>mediaSheet();
  $('mediaModel').onchange=()=>{$('mediaParams').innerHTML=renderParams()};
  $('mediaGenerate').onclick=async()=>{
    const opts={};document.querySelectorAll('#mediaParams select').forEach(el=>{const key=el.id.replace('media_','');opts[key]=el.value});
    const b=$('mediaGenerate');b.disabled=true;b.textContent='Запущено…';
    try{const d=await api('/api/media/generate',{method:'POST',body:JSON.stringify({kind,prompt:$('mediaPrompt').value,model:$('mediaModel').value,opts}),timeout:35000});const job=d.job_id;if(!job)throw new Error('Сервер не вернул ID задачи.');openSheet(titles[kind],`<div class="card"><b>⏳ Генерация запущена</b><small>Можно оставить Mini App открытым — результат появится автоматически.</small></div>`);const done=await pollMediaJob(job);openSheet(titles[kind],mediaResultHtml(done,kind));applyState(S.state);haptic('light')}catch(e){toast(e.message);b.disabled=false;b.textContent='Создать'}
  };
}
function settingsSheet(){const models=(S.models||[]).map(m=>{const id=typeof m==='string'?m:m.id;return `<option value="${esc(id)}" ${S.state?.model===id?'selected':''}>${esc(id)}</option>`}).join('');openSheet('Настройки',`<div class="sectionTitle">Модель</div><select class="field" id="modelSelect"><option value="auto">🤖 Auto</option>${models}</select><div class="sectionTitle">Стиль ответа</div><select class="field" id="styleSelect"><option value="normal">Обычно</option><option value="short">Кратко</option><option value="detailed">Подробно</option></select><button class="primary" id="saveSettings">Сохранить</button><div class="sectionTitle">Доступ</div><div class="card">${esc(S.state?.license?.status||S.state?.license?.reason||'')}</div>`);$('styleSelect').value=S.state?.style||'normal';$('saveSettings').onclick=async()=>{await action('/api/settings',{model:$('modelSelect').value,style:$('styleSelect').value});closeSheet()}}
async function profileSheet(){let html=`<div class="card">${esc(S.state?.license?.status||S.state?.license?.reason||'Доступ открыт')}</div>`;if(S.state?.license?.required&&!S.state?.license?.active)html+=`<div class="sectionTitle">Активация</div><input class="field" id="licenseCode" placeholder="BULBA-XXXX-XXXX"><button class="primary" id="activate">Активировать</button>`;html+=`<div class="sectionTitle">Статистика</div><div class="card">Запросов: ${S.state?.requests||0}<br>Ошибок: ${S.state?.errors||0}<br>Чатов: ${(S.state?.chats||[]).length}</div>`;if(S.state?.is_admin)html+=`<button class="secondary" id="admin">👑 Админ-панель</button>`;openSheet('Профиль',html);if($('activate'))$('activate').onclick=async()=>{const d=await action('/api/activate',{code:$('licenseCode').value});if(d?.ok){toast('Лицензия активирована');profileSheet()}};if($('admin'))$('admin').onclick=adminSheet}
function favoritesSheet(){const fav=S.state?.favorites||[];const rows=fav.map(x=>`<div class="card"><div>${esc(x.text)}</div><button class="secondary danger" data-delfav="${x.id}">Удалить</button></div>`).join('');openSheet('Избранное',`${rows||'<div class="empty">Сохранённых ответов нет</div>'}`);document.querySelectorAll('[data-delfav]').forEach(b=>b.onclick=async()=>{await action('/api/favorite/delete',{id:b.dataset.delfav});favoritesSheet()})}
function statsSheet(){openSheet('Статистика',`<div class="card"><b>BulbaMaxAI ${esc(S.state?.version)}</b><br>Ваши запросы: ${S.state?.requests||0}<br>Ваши ошибки: ${S.state?.errors||0}<br>Всего запросов: ${S.state?.stats?.total_requests||0}<br>Всего ошибок: ${S.state?.stats?.total_errors||0}</div>`)}
async function adminSheet(){try{const [r,s]=await Promise.all([api('/api/admin/rules'),api('/api/admin/stats')]);const rules=r.rules||[];openSheet('Админ-панель',`<div class="card">Пользователей: ${s.stats.users}<br>Запросов: ${s.stats.requests}<br>Ошибок: ${s.stats.errors}<br>Правил: ${s.stats.rules}</div><div class="sectionTitle">Глобальное правило</div><input class="field" id="rulePattern" placeholder="Фраза"><textarea class="field" id="ruleResponse" placeholder="Ответ"></textarea><select class="field" id="ruleMode"><option value="contains">Содержит</option><option value="exact">Точное совпадение</option></select><button class="primary" id="ruleAdd">Добавить правило</button><div class="sectionTitle">Правила</div>${rules.map(x=>`<div class="row"><div class="grow"><b>${esc(x.pattern)}</b><small>${esc(x.response)}</small></div><button class="close danger" data-rule="${x.id}">×</button></div>`).join('')||'<div class="empty">Правил нет</div>'}<div class="sectionTitle">Выдать лицензию</div><input class="field" id="licUser" placeholder="USER_ID"><input class="field" id="licDays" type="number" placeholder="Дни"><input class="field" id="licReq" type="number" placeholder="Запросы, 0 = без лимита"><button class="secondary" id="licAdd">Создать и выдать</button>`);$('ruleAdd').onclick=async()=>{await action('/api/admin/rules',{action:'add',pattern:$('rulePattern').value,response:$('ruleResponse').value,mode:$('ruleMode').value});adminSheet()};document.querySelectorAll('[data-rule]').forEach(b=>b.onclick=async()=>{await action('/api/admin/rules',{action:'delete',id:b.dataset.rule});adminSheet()});$('licAdd').onclick=async()=>{const d=await action('/api/admin/license',{user_id:$('licUser').value,days:+$('licDays').value,requests:+$('licReq').value||0});if(d?.code)toast(d.code)}}catch(e){toast(e.message)}}
function brandMenu(){openSheet('Bulba AI',`<button class="row" id="mMedia"><div class="grow"><b>🎨 Media Studio</b><small>Изображения, видео, голос, музыка, 3D</small></div><span class="arrow">›</span></button><button class="row" id="mChats"><div class="grow"><b>💬 Чаты</b><small>История и управление</small></div><span class="arrow">›</span></button><button class="row" id="mMemory"><div class="grow"><b>💾 Память</b><small>Сохранённые данные</small></div><span class="arrow">›</span></button><button class="row" id="mStats"><div class="grow"><b>📊 Статистика</b><small>Ваши показатели</small></div><span class="arrow">›</span></button><button class="row" id="mFavorites"><div class="grow"><b>⭐ Избранное</b><small>Сохранённые ответы</small></div><span class="arrow">›</span></button><button class="row" id="mSettings"><div class="grow"><b>⚙️ Настройки</b><small>Модель и стиль</small></div><span class="arrow">›</span></button>`);$('mMedia').onclick=mediaSheet;$('mChats').onclick=chatsSheet;$('mMemory').onclick=memorySheet;$('mStats').onclick=statsSheet;$('mFavorites').onclick=favoritesSheet;$('mSettings').onclick=settingsSheet}
function tab(name){if(name==='chatTab')closeSheet();else if(name==='mediaTab')mediaSheet();else if(name==='chatsTab')chatsSheet();else if(name==='memoryTab')memorySheet();else settingsSheet();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{input.value=b.dataset.q+' ';resize();input.focus()});$('brand').onclick=brandMenu;$('profileBtn').onclick=profileSheet;$('attach').onclick=()=>file.click();file.onchange=()=>chooseFile(file.files?.[0]);$('removeFile').onclick=clearFile;send.onclick=sendMessage;input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});load();resize();
})();
</script>
</body>
</html>
