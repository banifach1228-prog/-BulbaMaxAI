<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0f">
<meta name="color-scheme" content="dark">
<title>Bulba AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0b0f;
  --panel:#121218;
  --panel2:#181820;
  --line:rgba(255,255,255,.08);
  --text:#f5f5f7;
  --muted:#9898a3;
  --accent:#fff;
  --accentText:#000;
  --danger:#ff5f57;
  --safe-top:env(safe-area-inset-top);
  --safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
body{min-height:100vh;padding-bottom:calc(84px + var(--safe-bottom));overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{border:0;color:inherit}
.hidden{display:none!important}
.app{max-width:760px;margin:0 auto}
.top{
  position:sticky;top:0;z-index:20;
  padding:calc(12px + var(--safe-top)) 14px 12px;
  background:rgba(11,11,15,.86);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line);
}
.toprow{display:flex;align-items:center;gap:10px}
.brand{font-size:18px;font-weight:800;letter-spacing:-.3px;cursor:pointer}
.status{font-size:11px;color:var(--muted);margin-top:3px}
.topspacer{flex:1}
.iconbtn{
  width:40px;height:40px;border-radius:13px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid var(--line);font-size:18px
}
.badge{
  position:absolute;right:8px;top:6px;width:8px;height:8px;border-radius:50%;
  background:#fff
}
main{padding:18px 14px 0}
.hero{text-align:center;padding:45px 10px 20px}
.logo{
  width:70px;height:70px;border-radius:22px;background:#fff;color:#000;
  margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:900;box-shadow:0 12px 35px rgba(255,255,255,.08)
}
.hero h1{font-size:27px;margin:0 0 8px;letter-spacing:-.8px}
.hero p{margin:0 auto;color:var(--muted);max-width:520px;line-height:1.5}
.suggestions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.chip{
  background:var(--panel2);border:1px solid var(--line);border-radius:18px;
  padding:9px 13px;font-size:13px;cursor:pointer
}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.msg{display:flex;flex-direction:column;max-width:88%;gap:4px}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.assistant{align-self:flex-start;align-items:flex-start}
.bubble{
  padding:12px 14px;border-radius:18px;background:var(--panel2);
  line-height:1.48;white-space:pre-wrap;word-break:break-word;
  border:1px solid var(--line)
}
.msg.user .bubble{
  background:#fff;color:#000;border-color:#fff;border-bottom-right-radius:6px
}
.msg.assistant .bubble{border-bottom-left-radius:6px}
.meta{font-size:10px;color:var(--muted);padding:0 4px}
.msg .secondary{margin-top:1px}
.composerWrap{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:8px 12px calc(8px + var(--safe-bottom));
  background:rgba(11,11,15,.9);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--line)
}
.composer{max-width:760px;margin:auto;display:flex;align-items:flex-end;gap:8px}
.inputBox{
  flex:1;display:flex;align-items:flex-end;gap:6px;
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:7px 8px 7px 13px
}
textarea{
  width:100%;resize:none;outline:none;border:0;background:transparent;color:var(--text);
  min-height:24px;max-height:130px;line-height:1.4;padding:5px 0
}
textarea::placeholder{color:#777782}
.circle{
  width:40px;height:40px;border-radius:50%;background:#fff;color:#000;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  font-size:17px;font-weight:700
}
.circle:disabled{opacity:.35;cursor:default}
.attach{
  width:38px;height:38px;border-radius:12px;background:transparent;
  color:var(--muted);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:19px;flex:none
}
#file{display:none}
.filePreview{
  display:none;max-width:760px;margin:0 auto 6px;
  padding:8px 12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:13px;font-size:12px
}
.filePreview.show{display:flex;align-items:center;gap:8px}
.filePreview .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{
  position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;
  background:rgba(0,0,0,.5)
}
.sheet.show{display:flex}
.sheetCard{
  width:100%;max-height:88vh;overflow:auto;background:var(--panel);
  border-top-left-radius:25px;border-top-right-radius:25px;
  padding:10px 14px calc(18px + var(--safe-bottom));
  border-top:1px solid var(--line)
}
.grab{width:42px;height:5px;border-radius:5px;background:#444;margin:3px auto 12px}
.sheetHead{display:flex;align-items:center;margin-bottom:15px}
.sheetHead h2{margin:0;font-size:20px;letter-spacing:-.4px}
.close{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--panel2);cursor:pointer}
.sectionTitle{font-size:12px;color:var(--muted);margin:18px 2px 8px}
.card{
  background:var(--panel2);border:1px solid var(--line);border-radius:16px;
  padding:13px;margin-bottom:8px;line-height:1.45
}
.row{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  padding:13px;border-radius:15px;background:var(--panel2);
  border:1px solid var(--line);margin-bottom:8px;cursor:pointer
}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:14px}
.row small{display:block;color:var(--muted);font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.arrow{color:var(--muted);font-size:20px}
.field{
  width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:14px;padding:12px;outline:none;margin-bottom:8px
}
textarea.field{min-height:90px;resize:vertical}
.primary,.secondary{
  width:100%;padding:12px;border-radius:14px;cursor:pointer;margin-bottom:8px;
  font-weight:700
}
.primary{background:#fff;color:#000}
.secondary{background:var(--panel2);border:1px solid var(--line)}
.danger{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:20px}
.typing{
  display:none;align-items:center;gap:5px;color:var(--muted);font-size:12px;
  padding:4px 8px
}
.typing.show{display:flex}
.dot{width:5px;height:5px;border-radius:50%;background:#777;animation:pulse 1s infinite alternate}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  padding:8px 12px calc(8px + var(--safe-bottom));
  pointer-events:none
}
.navinner{
  max-width:760px;margin:auto;display:flex;gap:6px;padding:6px;
  background:rgba(24,24,32,.94);border:1px solid var(--line);
  border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.3);
  pointer-events:auto;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)
}
.nav button{
  flex:1;background:transparent;color:var(--muted);padding:8px 5px;
  border-radius:14px;cursor:pointer;font-size:11px
}
.nav button.active{background:#fff;color:#000}
.navIcon{font-size:17px;display:block;margin-bottom:2px}
@media(min-width:700px){
  .composerWrap{padding-bottom:14px}
  .nav{bottom:10px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div id="brand" class="brand">Bulba AI<div id="status" class="status">Подключение…</div></div>
      <div class="topspacer"></div>
      <button class="iconbtn" id="profileBtn">◉</button>
    </div>
  </header>

  <main>
    <section id="hero" class="hero">
      <div class="logo">B</div>
      <h1>Bulba AI</h1>
      <p>Единый AI-помощник для чатов, файлов, памяти, расчётов и других задач.</p>
    </section>

    <div id="suggestions" class="suggestions">
      <button class="chip" data-q="Объясни простыми словами">Объясни</button>
      <button class="chip" data-q="Сделай краткий план">Сделай план</button>
      <button class="chip" data-q="Реши задачу и покажи решение">Реши задачу</button>
      <button class="chip" data-q="Проверь мой текст на ошибки">Проверь текст</button>
    </div>

    <div id="chat" class="chat"></div>

    <div id="typing" class="typing">
      <span>Bulba AI думает</span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </main>
</div>

<div class="filePreview" id="filePreview">
  <div>📎</div>
  <div class="grow" id="fileName"></div>
  <button class="close" id="removeFile">×</button>
</div>

<div class="composerWrap">
  <div class="composer">
    <div class="inputBox">
      <button class="attach" id="attach">＋</button>
      <textarea id="input" rows="1" placeholder="Сообщение…"></textarea>
    </div>
    <button class="circle" id="send">↑</button>
  </div>
</div>

<input type="file" id="file" accept="image/*,.pdf,.docx,.xlsx,.csv,.txt,.md,.json,.log,.py,.js,.html,.css">

<nav class="nav">
  <div class="navinner">
    <button data-tab="chatTab" class="active"><span class="navIcon">⌂</span>Чат</button>
    <button data-tab="chatsTab"><span class="navIcon">▤</span>Чаты</button>
    <button data-tab="memoryTab"><span class="navIcon">◆</span>Память</button>
    <button data-tab="settingsTab"><span class="navIcon">⚙</span>Настройки</button>
  </div>
</nav>

<div class="sheet" id="sheet">
  <div class="sheetCard" id="sheetCard"></div>
</div>

<div id="toast" style="
position:fixed;left:50%;bottom:calc(94px + var(--safe-bottom));transform:translateX(-50%);
background:#fff;color:#000;padding:10px 15px;border-radius:14px;font-size:12px;
font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:100;white-space:nowrap">
</div>

<script>
(()=>{
'use strict';

const tg=window.Telegram?.WebApp;
try{tg?.ready();tg?.expand()}catch{}

const $=id=>document.getElementById(id);
const chat=$('chat');
const input=$('input');
const send=$('send');
const file=$('file');
const sheet=$('sheet');
const sheetCard=$('sheetCard');
const toastEl=$('toast');

const S={
  init:tg?.initData||'',
  state:null,
  models:[],
  file:null,
  sending:false
};

function esc(v){
  return String(v??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function toast(t){
  toastEl.textContent=t;
  toastEl.classList.add('show');
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>toastEl.classList.remove('show'),2300);
}

const style=document.createElement('style');
style.textContent='.show{opacity:1!important}';
document.head.appendChild(style);

function haptic(type='light'){
  try{tg?.HapticFeedback?.impactOccurred(type)}catch{}
}

async function api(path,opt={}){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),opt.timeout||35000);

  try{
    const r=await fetch(path,{
      ...opt,
      headers:{
        'Content-Type':'application/json',
        'X-Telegram-Init-Data':S.init,
        ...(opt.headers||{})
      },
      signal:ctrl.signal
    });

    const d=await r.json().catch(()=>({error:'Некорректный ответ сервера'}));

    if(!r.ok)throw new Error(d.error||d.message||'Ошибка сервера');

    return d;
  }finally{
    clearTimeout(timer);
  }
}

function closeSheet(){
  sheet.classList.remove('show');
  sheetCard.innerHTML='';
}

function openSheet(title,html){
  sheetCard.innerHTML=
    `<div class="grab"></div>
     <div class="sheetHead">
       <h2>${esc(title)}</h2>
       <button class="close" id="closeSheet">×</button>
     </div>${html}`;

  sheet.classList.add('show');
  $('closeSheet').onclick=closeSheet;
}

sheet.onclick=e=>{
  if(e.target===sheet)closeSheet();
};

function applyState(state){
  S.state=state;

  $('status').textContent=
    `${state.version} • ${state.license?.active?'доступ активен':'доступ ограничен'}`;

  renderChat(
    ((state.chats||[]).find(c=>String(c.id)===String(state.active_chat))||{}).messages||[]
  );

  updateSend();
}

function renderChat(history){
  chat.innerHTML='';

  if(!history.length){
    $('hero').classList.remove('hidden');
    $('suggestions').classList.remove('hidden');
    return;
  }

  $('hero').classList.add('hidden');
  $('suggestions').classList.add('hidden');

  for(const m of history){
    if(!['user','assistant'].includes(m.role))continue;
    addBubble(m.role,m.content,false);
  }

  scrollBottom();
}

function addBubble(role,text,scroll=true){
  const el=document.createElement('div');

  el.className='msg '+role;

  el.innerHTML=
    `<div class="bubble">${esc(text)}</div>
     <div class="meta">${role==='user'?'Вы':'Bulba AI'}</div>
     ${role==='assistant'
       ?'<button class="secondary" data-save-answer>⭐ Сохранить</button>'
       :''}`;

  chat.appendChild(el);

  if(role==='assistant'){
    el.querySelector('[data-save-answer]').onclick=async()=>{
      const d=await action('/api/favorite',{answer:text});
      if(d?.ok)toast('Сохранено в избранное');
    };
  }

  if(scroll)scrollBottom();
}

function scrollBottom(){
  requestAnimationFrame(()=>{
    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:'smooth'
    });
  });
}

function resize(){
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,130)+'px';
  updateSend();
}

function updateSend(){
  send.disabled=S.sending||(!input.value.trim()&&!S.file);
}

async function load(){
  if(!S.init){
    toast('Открой Mini App через Telegram.');
    return;
  }

  try{
    const [a,b]=await Promise.all([
      api('/api/state'),
      api('/api/models')
    ]);

    S.models=b.models||[];
    applyState(a.state);
  }catch(e){
    $('status').textContent='Ошибка подключения';
    toast(e.message);
  }
}

async function sendMessage(){
  if(S.sending)return;

  const text=input.value.trim();

  if(!text&&!S.file)return;

  S.sending=true;
  updateSend();

  const f=S.file;

  input.value='';
  resize();
  clearFile();

  addBubble('user',text||`[${f?.name||'файл'}]`);
  $('typing').classList.add('show');

  try{
    const body={
      message:text,
      model:S.state?.model||'auto',
      chat_id:S.state?.active_chat
    };

    if(f){
      if(f.kind==='image'){
        body.image=f.data;
      }else{
        body.file={
          name:f.name,
          data:f.data
        };
      }
    }

    const d=await api('/api/chat',{
      method:'POST',
      body:JSON.stringify(body),
      timeout:110000
    });

    $('typing').classList.remove('show');

    addBubble('assistant',d.answer||'');
    applyState(d.state);

    if(d.file)downloadFile(d.file);

    haptic('light');
  }catch(e){
    $('typing').classList.remove('show');

    addBubble(
      'assistant',
      '❌ '+(
        e.name==='AbortError'
          ?'Сервер слишком долго не отвечает.'
          :e.message
      )
    );

    haptic('heavy');
  }finally{
    S.sending=false;
    updateSend();
    input.focus();
  }
}

function downloadFile(f){
  try{
    const a=document.createElement('a');
    a.href=`data:${f.mime};base64,${f.data}`;
    a.download=f.name;
    a.click();
    toast(`Файл ${f.name} готов`);
  }catch{
    toast('Файл создан, но скачать его не удалось');
  }
}

function clearFile(){
  S.file=null;
  $('filePreview').classList.remove('show');
  $('fileName').textContent='';
  file.value='';
  updateSend();
}

function imageData(f){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(f);
  });
}

async function chooseFile(f){
  if(!f)return;

  if(f.size===0){
    toast('Файл пустой');
    return;
  }

  if(f.size>10*1024*1024){
    toast('Файл больше 10 МБ');
    return;
  }

  try{
    const data=await imageData(f);

    S.file={
      name:f.name,
      data,
      kind:f.type.startsWith('image/')?'image':'file'
    };

    $('fileName').textContent=f.name;
    $('filePreview').classList.add('show');

    updateSend();
    haptic('light');
  }catch{
    toast('Не удалось прочитать файл');
  }
}

function chatsSheet(){
  const rows=(S.state?.chats||[]).map(c=>
    `<button class="row" data-chat="${esc(c.id)}">
      <div class="grow">
        <b>${c.pinned?'📌 ':''}${esc(c.title)}</b>
        <small>${c.requests} запросов</small>
      </div>
      <span class="arrow">
        ${String(c.id)===String(S.state?.active_chat)?'✓':'›'}
      </span>
    </button>`
  ).join('');

  openSheet(
    'Чаты',
    `${rows||'<div class="empty">Чатов пока нет</div>'}
     <button class="primary" id="newChatSheet">＋ Новый чат</button>`
  );

  document.querySelectorAll('[data-chat]').forEach(b=>{
    b.onclick=async()=>{
      await action('/api/chat/select',{
        chat_id:b.dataset.chat
      });
      closeSheet();
    };
  });

  $('newChatSheet').onclick=async()=>{
    await action('/api/chat/new');
    closeSheet();
  };
}

async function action(path,body){
  try{
    const d=await api(path,{
      method:'POST',
      body:JSON.stringify(body||{})
    });

    if(d.state)applyState(d.state);

    haptic('light');
    return d;
  }catch(e){
    toast(e.message);
  }
}

function memorySheet(){
  const mem=S.state?.memory||{};

  const rows=Object.entries(mem).map(([k,v])=>
    `<div class="row">
      <div class="grow">
        <b>${esc(k)}</b>
        <small>${esc(v)}</small>
      </div>
      <button class="close danger" data-delmem="${esc(k)}">×</button>
    </div>`
  ).join('');

  openSheet(
    'Память',
    `${rows||'<div class="empty">Память пуста</div>'}
     <div class="sectionTitle">Добавить</div>
     <input class="field" id="memKey" placeholder="Название">
     <input class="field" id="memVal" placeholder="Значение">
     <button class="primary" id="memAdd">Сохранить</button>
     <button class="secondary" id="memClear">Очистить память</button>`
  );

  document.querySelectorAll('[data-delmem]').forEach(b=>{
    b.onclick=async()=>{
      await action('/api/memory',{
        action:'delete',
        key:b.dataset.delmem
      });
      memorySheet();
    };
  });

  $('memAdd').onclick=async()=>{
    await action('/api/memory',{
      action:'set',
      key:$('memKey').value,
      value:$('memVal').value
    });
    memorySheet();
  };

  $('memClear').onclick=async()=>{
    await action('/api/memory',{
      action:'clear'
    });
    memorySheet();
  };
}

function settingsSheet(){
  const models=(S.models||[]).map(m=>{
    const id=typeof m==='string'?m:m.id;

    return `<option value="${esc(id)}"
      ${S.state?.model===id?'selected':''}>
      ${esc(id)}
    </option>`;
  }).join('');

  openSheet(
    'Настройки',
    `<div class="sectionTitle">Модель</div>
     <select class="field" id="modelSelect">
       <option value="auto">🤖 Auto</option>
       ${models}
     </select>

     <div class="sectionTitle">Стиль ответа</div>
     <select class="field" id="styleSelect">
       <option value="normal">Обычно</option>
       <option value="short">Кратко</option>
       <option value="detailed">Подробно</option>
     </select>

     <button class="primary" id="saveSettings">Сохранить</button>

     <div class="sectionTitle">Доступ</div>
     <div class="card">
       ${esc(S.state?.license?.status||S.state?.license?.reason||'')}
     </div>`
  );

  $('styleSelect').value=S.state?.style||'normal';

  $('saveSettings').onclick=async()=>{
    await action('/api/settings',{
      model:$('modelSelect').value,
      style:$('styleSelect').value
    });

    closeSheet();
  };
}

async function profileSheet(){
  let html=
    `<div class="card">
      ${esc(
        S.state?.license?.status||
        S.state?.license?.reason||
        'Доступ открыт'
      )}
    </div>`;

  if(
    S.state?.license?.required&&
    !S.state?.license?.active
  ){
    html+=
      `<div class="sectionTitle">Активация</div>
       <input class="field" id="licenseCode" placeholder="BULBA-XXXX-XXXX">
       <button class="primary" id="activate">Активировать</button>`;
  }

  html+=
    `<div class="sectionTitle">Статистика</div>
     <div class="card">
       Запросов: ${S.state?.requests||0}<br>
       Ошибок: ${S.state?.errors||0}<br>
       Чатов: ${(S.state?.chats||[]).length}
     </div>`;

  if(S.state?.is_admin){
    html+=`<button class="secondary" id="admin">👑 Админ-панель</button>`;
  }

  openSheet('Профиль',html);

  if($('activate')){
    $('activate').onclick=async()=>{
      const d=await action('/api/activate',{
        code:$('licenseCode').value
      });

      if(d?.ok){
        toast('Лицензия активирована');
        profileSheet();
      }
    };
  }

  if($('admin'))$('admin').onclick=adminSheet;
}

function favoritesSheet(){
  const fav=S.state?.favorites||[];

  const rows=fav.map(x=>
    `<div class="card">
      <div>${esc(x.text)}</div>
      <button class="secondary danger" data-delfav="${x.id}">
        Удалить
      </button>
    </div>`
  ).join('');

  openSheet(
    'Избранное',
    rows||'<div class="empty">Сохранённых ответов нет</div>'
  );

  document.querySelectorAll('[data-delfav]').forEach(b=>{
    b.onclick=async()=>{
      await action('/api/favorite/delete',{
        id:b.dataset.delfav
      });

      favoritesSheet();
    };
  });
}

function statsSheet(){
  openSheet(
    'Статистика',
    `<div class="card">
      <b>BulbaMaxAI ${esc(S.state?.version)}</b><br>
      Ваши запросы: ${S.state?.requests||0}<br>
      Ваши ошибки: ${S.state?.errors||0}<br>
      Всего запросов: ${S.state?.stats?.total_requests||0}<br>
      Всего ошибок: ${S.state?.stats?.total_errors||0}
    </div>`
  );
}

async function adminSheet(){
  try{
    const [r,s]=await Promise.all([
      api('/api/admin/rules'),
      api('/api/admin/stats')
    ]);

    const rules=r.rules||[];

    openSheet(
      'Админ-панель',
      `<div class="card">
        Пользователей: ${s.stats.users}<br>
        Запросов: ${s.stats.requests}<br>
        Ошибок: ${s.stats.errors}<br>
        Правил: ${s.stats.rules}
      </div>

      <div class="sectionTitle">Глобальное правило</div>

      <input class="field" id="rulePattern" placeholder="Фраза">

      <textarea class="field" id="ruleResponse" placeholder="Ответ"></textarea>

      <select class="field" id="ruleMode">
        <option value="contains">Содержит</option>
        <option value="exact">Точное совпадение</option>
      </select>

      <button class="primary" id="ruleAdd">
        Добавить правило
      </button>

      <div class="sectionTitle">Правила</div>

      ${
        rules.map(x=>
          `<div class="row">
            <div class="grow">
              <b>${esc(x.pattern)}</b>
              <small>${esc(x.response)}</small>
            </div>
            <button class="close danger" data-rule="${x.id}">×</button>
          </div>`
        ).join('')
        ||
        '<div class="empty">Правил нет</div>'
      }

      <div class="sectionTitle">Выдать лицензию</div>

      <input class="field" id="licUser" placeholder="USER_ID">

      <input class="field" id="licDays" type="number" placeholder="Дни">

      <input class="field" id="licReq" type="number"
        placeholder="Запросы, 0 = без лимита">

      <button class="secondary" id="licAdd">
        Создать и выдать
      </button>`
    );

    $('ruleAdd').onclick=async()=>{
      await action('/api/admin/rules',{
        action:'add',
        pattern:$('rulePattern').value,
        response:$('ruleResponse').value,
        mode:$('ruleMode').value
      });

      adminSheet();
    };

    document.querySelectorAll('[data-rule]').forEach(b=>{
      b.onclick=async()=>{
        await action('/api/admin/rules',{
          action:'delete',
          id:b.dataset.rule
        });

        adminSheet();
      };
    });

    $('licAdd').onclick=async()=>{
      const d=await action('/api/admin/license',{
        user_id:$('licUser').value,
        days:+$('licDays').value,
        requests:+$('licReq').value||0
      });

      if(d?.code)toast(d.code);
    };

  }catch(e){
    toast(e.message);
  }
}

function brandMenu(){
  openSheet(
    'Bulba AI',
    `<button class="row" id="mChats">
      <div class="grow">
        <b>💬 Чаты</b>
        <small>История и управление</small>
      </div>
      <span class="arrow">›</span>
    </button>

    <button class="row" id="mMemory">
      <div class="grow">
        <b>💾 Память</b>
        <small>Сохранённые данные</small>
      </div>
      <span class="arrow">›</span>
    </button>

    <button class="row" id="mStats">
      <div class="grow">
        <b>📊 Статистика</b>
        <small>Ваши показатели</small>
      </div>
      <span class="arrow">›</span>
    </button>

    <button class="row" id="mFavorites">
      <div class="grow">
        <b>⭐ Избранное</b>
        <small>Сохранённые ответы</small>
      </div>
      <span class="arrow">›</span>
    </button>

    <button class="row" id="mSettings">
      <div class="grow">
        <b>⚙️ Настройки</b>
        <small>Модель и стиль</small>
      </div>
      <span class="arrow">›</span>
    </button>`
  );

  $('mChats').onclick=chatsSheet;
  $('mMemory').onclick=memorySheet;
  $('mStats').onclick=statsSheet;
  $('mFavorites').onclick=favoritesSheet;
  $('mSettings').onclick=settingsSheet;
}

function tab(name){
  if(name==='chatTab'){
    closeSheet();
  }else if(name==='chatsTab'){
    chatsSheet();
  }else if(name==='memoryTab'){
    memorySheet();
  }else{
    settingsSheet();
  }

  document.querySelectorAll('.nav button').forEach(b=>{
    b.classList.toggle(
      'active',
      b.dataset.tab===name
    );
  });
}

document.querySelectorAll('.nav button').forEach(b=>{
  b.onclick=()=>tab(b.dataset.tab);
});

document.querySelectorAll('.chip').forEach(b=>{
  b.onclick=()=>{
    input.value=b.dataset.q+' ';
    resize();
    input.focus();
  };
});

$('brand').onclick=brandMenu;
$('profileBtn').onclick=profileSheet;

$('attach').onclick=()=>file.click();

file.onchange=()=>chooseFile(file.files?.[0]);

$('removeFile').onclick=clearFile;

send.onclick=sendMessage;

input.addEventListener('input',resize);

input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

load();
resize();

})();
</script>
</body>
</html>
